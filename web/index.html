<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by `flutter build web --base-href`. Left as the placeholder so the
    app can be served from a subdirectory without editing this file.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Buy, sell and connect with people near you. Browse local listings, message sellers directly, and turn what you no longer need into cash.">

  <!--
    viewport-fit=cover lets the app paint into the iPhone's safe areas instead
    of sitting in letterboxes once it is installed to the home screen. Flutter
    injects a viewport tag of its own, but only after the engine boots — which
    is several seconds away on a first visit, and the splash below has to be
    laid out correctly for all of them.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080C">

  <!--
    iOS home-screen install. Safari never prompts and ignores most of the web
    app manifest, so everything about how the installed app looks is decided
    here: `apple-mobile-web-app-capable` is what drops the browser chrome, and
    without `apple-touch-icon` iOS screenshots the page and uses that as the
    icon.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    Opaque, not black-translucent. Translucent lets the page draw under the
    clock, which only works if the page knows to stay clear of it — and Flutter
    web reports no safe-area insets at all, so the installed app put its header
    under the status bar. Black matches the ground the app starts on.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mambanda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mambanda Market</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #07080C; }

    /*
      A first visit downloads several megabytes of engine before Flutter can
      draw anything. Without this the user stares at a black rectangle and
      concludes the link is broken — on a slow connection that is the whole
      first impression. Plain CSS on purpose: it has to render from the HTML
      alone, before any script has run.
    */
    #boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      background: #07080C;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .mark { width: 96px; height: 96px; }
    #boot .mark svg { display: block; width: 100%; height: 100%; }
    #boot .name {
      color: #F3F4F7; font-size: 21px; font-weight: 700; letter-spacing: .2px;
    }
    #boot .hint { color: #9AA0B0; font-size: 13px; }
    #boot .bar {
      width: 132px; height: 3px; border-radius: 3px;
      background: rgba(201,229,5,.22); overflow: hidden;
    }
    #boot .bar i {
      display: block; height: 100%; width: 40%; border-radius: 3px;
      background: #C9E505; animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; }
    }

    /*
      iOS install prompt. Safari has no beforeinstallprompt and will never offer
      to install anything, so if we do not ask, nobody installs — they browse in
      a tab, and Safari clears a tab's storage after seven days unused, which
      signs them out. Installed to the home screen it is exempt from that.
    */
    #a2hs {
      /* At the top, never the bottom: down there it sat over the app's tab
         bar, and taps on Home/Favourites/Messages/Account landed on this card
         instead — the bar looked dead until the card was dismissed. */
      position: fixed; left: 12px; right: 12px; z-index: 9999;
      top: calc(12px + env(safe-area-inset-top));
      display: none; align-items: flex-start; gap: 12px;
      padding: 14px 14px 14px 16px;
      border-radius: 16px;
      background: #12141B;
      border: 1px solid #2A2E3A;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F3F4F7;
    }
    #a2hs.show { display: flex; }
    #a2hs .txt { flex: 1; font-size: 13.5px; line-height: 1.45; }
    #a2hs .txt b { display: block; font-size: 14.5px; margin-bottom: 3px; }
    #a2hs .txt span { color: #9AA0B0; }
    #a2hs .share {
      display: inline-block; vertical-align: -3px; width: 15px; height: 15px;
      margin: 0 2px;
    }
    #a2hs button {
      flex-shrink: 0; border: 0; background: transparent; color: #9AA0B0;
      font-size: 20px; line-height: 1; padding: 2px 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">
      <!-- The bag from inside the M (assets/brand/bag.svg). Straight on the
           dark ground: on the old lime tile its lime rim disappeared. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="36 51 440 440" aria-hidden="true">
        <defs>
          <linearGradient id="rim" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#E9FF3A"/>
            <stop offset=".55" stop-color="#B8E51C"/>
            <stop offset="1" stop-color="#7DB517"/>
          </linearGradient>
          <linearGradient id="lime" x1="1" y1="0" x2="0.2" y2="1">
            <stop offset="0" stop-color="#E4FB2A"/>
            <stop offset="1" stop-color="#A2D11B"/>
          </linearGradient>
          <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset=".6" stop-color="#E9EBEE"/>
            <stop offset="1" stop-color="#B9BDC4"/>
          </linearGradient>
        </defs>
      
        <!-- handle, with the rounded feet where it meets the rim -->
        <path d="M200 196 V128 A56 56 0 0 1 312 128 V196" fill="none" stroke="url(#rim)" stroke-width="28" stroke-linecap="round"/>
      
        <!-- body -->
        <path d="M146 180 H366 Q392 180 395 206 L418 432 Q422 470 384 470 H128 Q90 470 94 432 L117 206 Q120 180 146 180 Z"
              fill="#07080A" stroke="url(#rim)" stroke-width="28" stroke-linejoin="round"/>
        <circle cx="200" cy="192" r="14" fill="url(#rim)"/>
        <circle cx="312" cy="192" r="14" fill="url(#rim)"/>
      
        <!-- M: lime half behind, silver half in front -->
        <path d="M316 244 H346 Q358 244 358 256 V418 Q358 430 346 430 H328 Q316 430 316 418 V318 L278 368 L256 336 Z" fill="url(#lime)"/>
        <path d="M154 256 Q154 244 166 244 H194 L286 368 Q290 374 282 374 H262 Q256 374 252 368 L196 292 V418 Q196 430 184 430 H166 Q154 430 154 418 Z" fill="url(#silver)"/>
      
        <!-- the little bag at the foot of the M -->
        <g fill="none" stroke="url(#rim)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M247 396 V389 A10 10 0 0 1 267 389 V396"/>
          <path d="M242 396 H272 L276 426 H238 Z"/>
        </g>
      </svg>
    </div>
    <div class="name">Mambanda Market</div>
    <div class="bar"><i></i></div>
    <div class="hint">Loading…</div>
  </div>

  <div id="a2hs" role="note">
    <div class="txt">
      <b>Add Mambanda to your Home Screen</b>
      <span>Tap
        <svg class="share" viewBox="0 0 24 24" fill="none" stroke="#9AA0B0" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-label="Share">
          <path d="M12 15V3"/><path d="m8 7 4-4 4 4"/>
          <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
        </svg>
        then “Add to Home Screen” — it opens full screen and keeps you signed in.</span>
    </div>
    <button type="button" id="a2hsClose" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    // Flutter fires this once it has painted. Fading the splash on the event
    // rather than a timer means it is never pulled away from a still-blank
    // screen on a slow connection, and never lingers on a fast one.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 400);
    });

    // Not on first paint any more: the card sat over the top of whatever the
    // app opened on — the search bar, a listing's back button — for fifteen
    // seconds. The app asks for it instead, from screens where covering the
    // top costs nothing (Welcome, Account). See lib/web/install_hint.dart.
    var installOffered = false;
    window.mambandaOfferInstall = function () {
      if (installOffered) return;
      installOffered = true;
      maybeOfferInstall();
    };

    function maybeOfferInstall() {
      try {
        var ua = window.navigator.userAgent;
        // iPadOS reports as a Mac, so it is identified by having touch points.
        var isIOS = /iPhone|iPod/.test(ua) ||
                    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!isIOS) return;

        // Already installed — navigator.standalone is the iOS-specific signal.
        var standalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (standalone) return;

        // Only Safari can install. In Chrome or Firefox on iOS the Share menu
        // has no such option, so showing this would send people looking for a
        // button that is not there.
        if (!/Safari/.test(ua) || /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) return;

        if (localStorage.getItem('a2hs-dismissed') === '1') return;

        var bar = document.getElementById('a2hs');
        bar.classList.add('show');
        document.getElementById('a2hsClose').addEventListener('click', function () {
          bar.classList.remove('show');
          try { localStorage.setItem('a2hs-dismissed', '1'); } catch (e) {}
        });
        // It covers the top of the screen while shown, so it does not stay:
        // a quarter of a minute is enough to read it, and it comes back on the
        // next visit until it is dismissed.
        setTimeout(function () { bar.classList.remove('show'); }, 15000);
      } catch (e) {
        // A missing localStorage (private browsing) must not take the app with it.
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
