<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6473F0"/>
      <stop offset=".5" stop-color="#3F51B5"/>
      <stop offset="1" stop-color="#232970"/>
    </linearGradient>
    <mask id="awning">
      <rect x="192" y="224" width="640" height="208" rx="72" fill="#fff"/>
      <circle cx="272" cy="438" r="58" fill="#000"/>
      <circle cx="432" cy="438" r="58" fill="#000"/>
      <circle cx="592" cy="438" r="58" fill="#000"/>
      <circle cx="752" cy="438" r="58" fill="#000"/>
    </mask>
  </defs>

  <!-- full-bleed background; iOS applies its own squircle mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- storefront body -->
  <rect x="256" y="480" width="512" height="320" rx="56" fill="#fff" opacity=".22"/>
  <!-- doorway in the app's lime accent -->
  <rect x="432" y="592" width="160" height="208" rx="32" fill="#A2E03A"/>
  <!-- windows -->
  <rect x="320" y="560" width="72" height="72" rx="20" fill="#fff" opacity=".55"/>
  <rect x="632" y="560" width="72" height="72" rx="20" fill="#fff" opacity=".55"/>
  <!-- scalloped market awning -->
  <rect x="192" y="224" width="640" height="208" rx="72" fill="#fff" mask="url(#awning)"/>
</svg>
