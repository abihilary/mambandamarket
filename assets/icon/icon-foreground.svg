<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android adaptive-icon foreground: transparent, mark scaled into the
       centred 66% safe zone so launcher masks never clip it. -->
  <defs>
    <mask id="awning">
      <rect x="192" y="224" width="640" height="208" rx="72" fill="#fff"/>
      <circle cx="272" cy="438" r="58" fill="#000"/>
      <circle cx="432" cy="438" r="58" fill="#000"/>
      <circle cx="592" cy="438" r="58" fill="#000"/>
      <circle cx="752" cy="438" r="58" fill="#000"/>
    </mask>
  </defs>

  <g transform="translate(512 512) scale(0.66) translate(-512 -512)">
    <rect x="256" y="480" width="512" height="320" rx="56" fill="#fff" opacity=".3"/>
    <rect x="432" y="592" width="160" height="208" rx="32" fill="#A2E03A"/>
    <rect x="320" y="560" width="72" height="72" rx="20" fill="#fff" opacity=".7"/>
    <rect x="632" y="560" width="72" height="72" rx="20" fill="#fff" opacity=".7"/>
    <rect x="192" y="224" width="640" height="208" rx="72" fill="#fff" mask="url(#awning)"/>
  </g>
</svg>
