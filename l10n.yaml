# Flutter localization codegen config.
# English is the template; French is a full translation. Generated sources land
# in lib/l10n/gen (a real, committed folder — not the deprecated synthetic
# package) so imports are plain relative paths.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
